openapi: 3.1.0
info:
  title: Agent Harness Control Plane
  version: 1.0.0
paths:
  /healthz:
    get:
      responses:
        "200": {description: Process is alive}
  /readyz:
    get:
      responses:
        "200": {description: Postgres is reachable}
        "503": {description: Service is not ready}
  /webhooks/linear:
    post:
      description: Signed Linear webhook endpoint
      responses:
        "200": {description: Delivery accepted, deduplicated, or intentionally ignored}
        "401": {description: Invalid signature or timestamp}
  /join:
    get:
      description: Inert no-referrer landing page for a fragment-based one-time invitation
      responses:
        "200": {description: Join instructions; the URL fragment is never sent to the server}
  /auth/v1/initialize:
    post:
      description: Atomically exchange the Railway bootstrap bearer for the first owner device session
      security: [{bootstrapAuth: []}]
      responses:
        "201": {description: Owner and rotating device credentials created}
        "409": {description: Team access is already initialized}
  /auth/v1/invitations/redeem:
    post:
      description: Consume a one-time invitation and create a named member and device session
      responses:
        "201": {description: Invitation redeemed}
        "410": {description: Invitation is invalid, expired, revoked, or already used}
  /auth/v1/token:
    post:
      description: Rotate a device refresh token and mint a 15-minute access token
      responses:
        "200": {description: Rotated device credentials}
        "401": {description: Invalid token or replay; replay revokes the device session}
  /v1/whoami:
    get:
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Authenticated member, role, and device session}
  /v1/logout:
    post:
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Current device session revoked}
  /v1/team/members:
    get:
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Team members; admin role required}
  /v1/team/members/{member_id}:
    patch:
      security: [{bearerAuth: []}]
      parameters: [{name: member_id, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: Role updated; final owner cannot be demoted}
    delete:
      security: [{bearerAuth: []}]
      parameters: [{name: member_id, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: Member and all device sessions revoked}
  /v1/team/invitations:
    get:
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Invitation history without invitation secrets}
    post:
      security: [{bearerAuth: []}]
      responses:
        "201": {description: Single-use magic link returned exactly once}
  /v1/team/invitations/{invitation_id}:
    delete:
      security: [{bearerAuth: []}]
      parameters: [{name: invitation_id, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: Invitation revoked}
  /v1/team/sessions:
    get:
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Redacted device session inventory}
  /v1/team/sessions/{session_id}:
    delete:
      security: [{bearerAuth: []}]
      parameters: [{name: session_id, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: Device session revoked}
  /v1/team/audit:
    get:
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Authentication and authorization audit events}
  /v1/status:
    get:
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Control-plane status}
  /v1/repositories:
    get:
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Registered repositories}
    post:
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Repository registered or updated}
  /v1/repositories/{repository_id}:
    delete:
      security: [{bearerAuth: []}]
      parameters: [{name: repository_id, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: Repository automation disabled}
  /v1/repositories/{repository_id}/linear/issues:
    post:
      security: [{bearerAuth: []}]
      description: Create a root Linear issue with the repository's configured trigger label
      parameters: [{name: repository_id, in: path, required: true, schema: {type: string}}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, description]
              properties:
                title: {type: string}
                description: {type: string, maxLength: 65535}
      responses:
        "201": {description: Linear issue created; its webhook will claim the run}
  /v1/repositories/{repository_id}/linear/issues/{issue_id}/archive:
    post:
      security: [{bearerAuth: []}]
      description: Archive an explicitly confirmed non-canonical Linear issue
      parameters:
        - {name: repository_id, in: path, required: true, schema: {type: string}}
        - {name: issue_id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm: {type: boolean, const: true}
      responses:
        "200": {description: Issue archived}
        "409": {description: Issue is a canonical source or mapped child of a durable run}
  /v1/providers/linear/context:
    get:
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Connected Linear workspace, teams, and projects for repository registration}
  /v1/runs:
    get:
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Filtered runs}
  /v1/runs/{run_id}:
    get:
      security: [{bearerAuth: []}]
      parameters: [{name: run_id, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: Run, stage DAG, logical tickets, artifact metadata, and human-input requests, responses, and deliveries}
  /v1/input-requests:
    get:
      security: [{bearerAuth: []}]
      description: List durable human-input requests for the Inbox or a selected run
      parameters:
        - {name: status, in: query, required: false, schema: {type: string, enum: [open, answered, cancelled]}}
        - {name: run_id, in: query, required: false, schema: {type: string}}
      responses:
        "200": {description: Human-input requests}
  /v1/input-requests/{request_id}:
    get:
      security: [{bearerAuth: []}]
      parameters: [{name: request_id, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: Request with its channel deliveries and responses}
  /v1/input-requests/{request_id}/responses:
    post:
      security: [{bearerAuth: []}]
      description: Atomically accept an operator response, answer the request, and requeue the checkpointed run
      parameters: [{name: request_id, in: path, required: true, schema: {type: string}}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answers]
              properties:
                answers:
                  type: array
                  items: {$ref: '#/components/schemas/InputAnswer'}
      responses:
        "202": {description: Response accepted and run queued to resume}
        "409": {description: Request was already answered}
  /v1/runs/{run_id}/artifacts:
    get:
      security: [{bearerAuth: []}]
      parameters:
        - {name: run_id, in: path, required: true, schema: {type: string}}
        - {name: path, in: query, required: false, schema: {type: string}}
      responses:
        "200": {description: Artifact list or selected artifact body}
  /v1/runs/{run_id}/input:
    post:
      security: [{bearerAuth: []}]
      description: Replace clarified feature input for a paused run without creating a new claim
      parameters: [{name: run_id, in: path, required: true, schema: {type: string}}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [feature_request]
              properties:
                feature_request: {type: string, maxLength: 65535}
      responses:
        "202": {description: Input updated; run remains paused until explicitly resumed}
        "409": {description: Run is not paused}
  /v1/runs/{run_id}/resume:
    post:
      security: [{bearerAuth: []}]
      parameters: [{name: run_id, in: path, required: true, schema: {type: string}}]
      responses:
        "202": {description: Run queued for recovery}
  /v1/runs/{run_id}/cancel:
    post:
      security: [{bearerAuth: []}]
      parameters: [{name: run_id, in: path, required: true, schema: {type: string}}]
      responses:
        "202": {description: Run cancelled}
  /v1/events:
    get:
      security: [{bearerAuth: []}]
      description: Replayable Server-Sent Events stream using `after` or `Last-Event-ID`
      responses:
        "200": {description: Event stream, content: {text/event-stream: {schema: {type: string}}}}
  /v1/auth-slots:
    get:
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Redacted Codex authentication slot states}
    post:
      security: [{bearerAuth: []}]
      responses:
        "201": {description: Encrypted Codex authentication slot stored}
components:
  schemas:
    InputAnswer:
      type: object
      required: [question_id]
      properties:
        question_id: {type: string}
        option_id: {type: string}
        text: {type: string}
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Short-lived member access token with viewer, operator, admin, or owner authorization
    bootstrapAuth:
      type: http
      scheme: bearer
      description: One-time installation bootstrap token
