<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Agent Harness Runner</title>
  <style>
    :root { color-scheme: dark; --bg:#0a0d12; --panel:#111722; --line:#263145; --muted:#91a0b5; --text:#edf3fa; --accent:#73e0ba; --warn:#ffc66d; --bad:#ff8383; }
    * { box-sizing:border-box } body { margin:0; background:radial-gradient(circle at 12% 0,#152338 0,transparent 34%),var(--bg); color:var(--text); font:14px/1.45 ui-sans-serif,system-ui,sans-serif }
    header,main { width:min(1180px,calc(100% - 32px)); margin:auto } header { display:flex; align-items:end; justify-content:space-between; padding:36px 0 22px; gap:20px }
    h1 { margin:0; font-size:clamp(24px,4vw,38px); letter-spacing:-.04em } .eyebrow { color:var(--accent); text-transform:uppercase; letter-spacing:.16em; font-size:11px; font-weight:750 }
    .connection { display:flex; align-items:center; gap:8px; color:var(--muted) } .dot { width:9px; height:9px; border-radius:50%; background:var(--warn); box-shadow:0 0 0 4px #ffc66d22 }
    .dot.live { background:var(--accent); box-shadow:0 0 0 4px #73e0ba22 } .grid { display:grid; grid-template-columns:minmax(0,1.35fr) minmax(300px,.65fr); gap:16px; padding-bottom:32px }
    .panel { background:color-mix(in srgb,var(--panel) 92%,transparent); border:1px solid var(--line); border-radius:16px; overflow:hidden; box-shadow:0 18px 50px #0005 }
    .panel-head { display:flex; justify-content:space-between; align-items:center; padding:15px 18px; border-bottom:1px solid var(--line) } h2 { margin:0; font-size:14px } button { background:#1a2432; color:var(--text); border:1px solid #334157; border-radius:8px; padding:7px 11px; cursor:pointer }
    button:hover,button:focus-visible { border-color:var(--accent); outline:none } .runs { display:grid; gap:1px; background:var(--line) } .run { background:var(--panel); padding:16px 18px; cursor:pointer }
    .run:hover,.run:focus-visible { background:#151e2b; outline:none } .run.selected { background:#182434; box-shadow:inset 3px 0 var(--accent) } .run-top { display:flex; gap:12px; align-items:center; justify-content:space-between } .run strong { font-size:15px } .meta { color:var(--muted); margin-top:7px; display:flex; flex-wrap:wrap; gap:10px }
    .pill { border:1px solid var(--line); border-radius:999px; padding:3px 8px; font-size:11px; text-transform:uppercase; letter-spacing:.06em } .pill.running { color:var(--accent) } .pill.paused { color:var(--bad) } .pill.queued { color:var(--warn) }
    .run-group { padding:8px 18px 6px; color:var(--muted); background:#0d131c; font-size:10px; font-weight:750; text-transform:uppercase; letter-spacing:.12em } .empty { padding:34px 18px; color:var(--muted); text-align:center; background:var(--panel) } .events { max-height:70vh; overflow:auto; padding:6px 0 } .event { padding:12px 16px; border-bottom:1px solid #202a3a }
    .event:last-child { border:0 } .event-head { display:flex; justify-content:space-between; gap:10px; color:var(--muted); font-size:11px } .event-type { color:var(--accent); font-family:ui-monospace,monospace } .event p { margin:5px 0 0 }
    .event.error p,.event.error .event-type { color:var(--bad) } .detail { display:none; padding:18px; border-top:1px solid var(--line); background:#0d131c } .detail.visible { display:block } dl { display:grid; grid-template-columns:120px 1fr; margin:0; gap:8px 12px } dt { color:var(--muted) } dd { margin:0; overflow-wrap:anywhere }
    .subhead { margin:20px 0 8px; font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em } .dag,.ticket-list,.artifact-list { display:flex; flex-wrap:wrap; gap:8px } .dag { align-items:stretch } .dag-step { display:flex; align-items:center; gap:8px } .dag-arrow { color:var(--muted); font-size:18px } .node,.ticket,.artifact { border:1px solid var(--line); border-radius:9px; padding:7px 9px; background:#121a26 } .node.completed,.ticket.completed { border-color:#397b68 } .node.running { border-color:var(--accent); box-shadow:0 0 0 2px #73e0ba18 } .ticket { color:var(--text); text-decoration:none; min-width:150px } .ticket.running { border-color:var(--accent); background:#16322f; box-shadow:0 0 0 3px #73e0ba20; animation:pulse 1.6s ease-in-out infinite } .node small,.ticket small,.artifact small { display:block; color:var(--muted) } .artifact.external::after { content:'Notion'; margin-left:8px; color:var(--muted); font-size:10px; text-transform:uppercase } .activity .event-type { color:#8ab8ff } .activity p::before { content:'› '; color:#8ab8ff } a { color:var(--accent) } @keyframes pulse { 50% { box-shadow:0 0 0 6px #73e0ba0a } }
    @media (max-width:800px) { .grid { grid-template-columns:1fr } header { align-items:start; flex-direction:column } .events { max-height:440px } }
  </style>
</head>
<body>
  <header>
    <div><div class="eyebrow">Railway control plane</div><h1>Agent Harness Runner</h1></div>
    <div class="connection"><span id="dot" class="dot"></span><span id="connection">Connecting to event stream…</span></div>
  </header>
  <main class="grid">
    <section class="panel" aria-labelledby="runs-title">
      <div class="panel-head"><h2 id="runs-title">Pipeline runs</h2><button id="refresh" type="button">Refresh</button></div>
      <div id="runs" class="runs"><div class="empty">Loading runs…</div></div>
      <div id="detail" class="detail" aria-live="polite"></div>
    </section>
    <section class="panel" aria-labelledby="events-title">
      <div class="panel-head"><h2 id="events-title">Live events · all runs</h2><div><button id="show-all" type="button" hidden>Show all runs</button> <span id="event-count" class="pill">0</span></div></div>
      <div id="events" class="events" aria-live="polite"><div class="empty">Waiting for events…</div></div>
    </section>
  </main>
  <script>
    const runsEl=document.querySelector('#runs'),detailEl=document.querySelector('#detail'),eventsEl=document.querySelector('#events');
    let events=[],selectedRunID='',eventSource=null;
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const stamp=s=>s?new Date(s).toLocaleString():'—';
    const duration=ms=>{if(!ms)return '—';const seconds=Math.round(ms/1000);if(seconds<60)return seconds+'s';const minutes=Math.floor(seconds/60),rest=seconds%60;return `${minutes}m ${rest}s`};
    const tokens=run=>(Number(run.input_tokens)||0)+(Number(run.output_tokens)||0);
    const externalLink=(syncs,key,provider)=>syncs.find(s=>s.logical_key===key&&s.provider===provider&&s.state==='synced'&&s.external_url)?.external_url||'';
    const runStageLabel=run=>run.current_stage||(run.state==='completed'?'pipeline complete':run.state==='cancelled'?'cancelled':'awaiting stage');
    const runCard=run=>`<article class="run ${run.id===selectedRunID?'selected':''}" tabindex="0" data-id="${esc(run.id)}"><div class="run-top"><strong>${esc(run.source_issue_key)} · ${esc(run.source_issue_title)}</strong><span class="pill ${esc(run.state)}">${esc(run.state)}</span></div><div class="meta"><span>${esc(runStageLabel(run))}</span><span>${esc(duration(run.duration_ms))}</span><span>${tokens(run).toLocaleString()} tokens</span><span>${esc(stamp(run.updated_at))}</span></div></article>`;
    async function loadRuns(){try{const r=await fetch('/api/v1/runs?limit=100');if(!r.ok)throw new Error(await r.text());const data=await r.json(),runs=(Array.isArray(data.runs)?data.runs:[]).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)),active=runs.filter(run=>!['completed','cancelled'].includes(run.state)),history=runs.filter(run=>['completed','cancelled'].includes(run.state));runsEl.innerHTML=runs.length?`${active.length?'<div class="run-group">Current runs</div>'+active.map(runCard).join(''):''}${history.length?'<div class="run-group">Run history · newest first</div>'+history.map(runCard).join(''):''}`:'<div class="empty">No runs yet. Add the trigger label to a registered Linear issue.</div>';document.querySelectorAll('.run').forEach(el=>{const show=()=>showRun(el.dataset.id,true);el.onclick=show;el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();show()}}})}catch(e){runsEl.innerHTML=`<div class="empty">${esc(e.message)}</div>`}}
    async function showRun(id,select=false){if(select&&selectedRunID!==id){selectedRunID=id;connect(id);loadRuns()}const r=await fetch('/api/v1/runs/'+encodeURIComponent(id));if(!r.ok)throw new Error(await r.text());const data=await r.json(),run=data.run||{},stageOrder=s=>Number.isFinite(Number(s.details?.order))?Number(s.details.order):999,stages=(Array.isArray(data.stages)?data.stages:[]).sort((a,b)=>stageOrder(a)-stageOrder(b)),tickets=Array.isArray(data.tickets)?data.tickets:[],artifacts=Array.isArray(data.artifacts)?data.artifacts:[],syncs=Array.isArray(data.external_syncs)?data.external_syncs:[];const dag=stages.map((s,index)=>{const d=s.details||{};return `<div class="dag-step">${index?'<span class="dag-arrow" aria-hidden="true">→</span>':''}<div class="node ${esc(s.state)}"><strong>${esc(s.stage)}</strong><small>${esc(s.state)} · ${esc(d.mode||'stage')} · ×${esc(d.parallelism||1)}</small><small>${d.needs?.length?'after '+esc(d.needs.join(', ')):'root'}</small></div></div>`}).join('');const ticketRows=tickets.map(t=>{const url=externalLink(syncs,'ticket:'+t.logical_key,'linear'),tag=url?'a':'div';return `<${tag} class="ticket ${esc(t.state)}"${url?` href="${esc(url)}" target="_blank" rel="noopener"`:''}${t.state==='running'?' aria-current="step"':''}><strong>${esc(t.logical_key)}</strong><small>${esc(t.provider_issue_key||'not synced')} · ${esc(t.state)}</small><small>${t.dependencies?.length?'after '+esc(t.dependencies.join(', ')):'ready'}${t.commit_sha?' · '+esc(t.commit_sha.slice(0,8)):''}</small></${tag}>`}).join('');const notionRows=syncs.filter(s=>s.provider==='notion'&&s.logical_key.startsWith('artifact:')&&s.state==='synced'&&s.external_url).map(s=>`<a class="artifact external" href="${esc(s.external_url)}" target="_blank" rel="noopener">${esc(s.logical_key.slice(9))}</a>`).join(''),localRows=artifacts.map(a=>`<a class="artifact" href="/api/v1/runs/${encodeURIComponent(id)}/artifacts?path=${encodeURIComponent(a.path)}">${esc(a.path)} <small>${esc(a.size)} bytes</small></a>`).join(''),artifactRows=notionRows+localRows,totalTokens=tokens(run);detailEl.classList.add('visible');detailEl.innerHTML=`<dl><dt>Run</dt><dd>${esc(run.id)}</dd><dt>Issue</dt><dd><a href="${esc(run.source_issue_url)}" target="_blank" rel="noopener">${esc(run.source_issue_key)}</a></dd><dt>Duration</dt><dd>${esc(duration(run.duration_ms))}</dd><dt>Model</dt><dd>${esc(run.codex_model||'Awaiting first model turn')}</dd><dt>Model calls</dt><dd>${Number(run.codex_calls||0).toLocaleString()}</dd><dt>Tokens</dt><dd>${totalTokens.toLocaleString()} total · ${Number(run.input_tokens||0).toLocaleString()} input (${Number(run.cached_input_tokens||0).toLocaleString()} cached) · ${Number(run.output_tokens||0).toLocaleString()} output · ${Number(run.reasoning_output_tokens||0).toLocaleString()} reasoning</dd><dt>Est. API cost</dt><dd>$${Number(run.estimated_api_cost_usd||0).toFixed(4)}</dd><dt>Stage</dt><dd>${esc(run.current_stage||'—')}</dd><dt>Sandbox</dt><dd>${esc(run.sandbox_id||'—')}</dd><dt>Queue reason</dt><dd>${esc(run.queue_reason||'—')}</dd><dt>Branch</dt><dd>${esc(run.branch||'—')}</dd><dt>Pull request</dt><dd>${run.pull_request_url?`<a href="${esc(run.pull_request_url)}" target="_blank" rel="noopener">${esc(run.pull_request_url)}</a>`:'—'}</dd><dt>Error</dt><dd>${esc(run.error||'—')}</dd></dl><h3 class="subhead">Pipeline DAG · execution order</h3><div class="dag">${dag||'<span class="empty">Awaiting worker pipeline</span>'}</div><h3 class="subhead">Logical tickets</h3><div class="ticket-list">${ticketRows||'<span class="empty">No tickets yet</span>'}</div><h3 class="subhead">Artifacts</h3><div class="artifact-list">${artifactRows||'<span class="empty">No artifacts yet</span>'}</div>`}
    function renderEvents(){document.querySelector('#event-count').textContent=events.length;eventsEl.innerHTML=events.length?events.slice(-150).reverse().map(e=>`<article class="event ${esc(e.level)} ${e.type?.startsWith('codex.')?'activity':''}"><div class="event-head"><span class="event-type">${esc(e.type)}</span><time>${esc(new Date(e.created_at).toLocaleTimeString())}</time></div><p>${esc(e.message)}</p></article>`).join(''):'<div class="empty">Waiting for events…</div>'}
    function connect(runID=''){if(eventSource)eventSource.close();events=[];renderEvents();const title=document.querySelector('#events-title'),all=document.querySelector('#show-all');title.textContent=runID?'Live events · selected run':'Live events · all runs';all.hidden=!runID;eventSource=new EventSource('/events'+(runID?'?run_id='+encodeURIComponent(runID):''));eventSource.onopen=()=>{document.querySelector('#dot').classList.add('live');document.querySelector('#connection').textContent=runID?'Selected run stream':'All-runs event stream'};eventSource.onmessage=event=>{try{events.push(JSON.parse(event.data));renderEvents();loadRuns();if(selectedRunID)showRun(selectedRunID)}catch{}};eventSource.addEventListener('error',event=>{if(event.data){try{events.push(JSON.parse(event.data));renderEvents()}catch{}}document.querySelector('#dot').classList.remove('live');document.querySelector('#connection').textContent='Reconnecting…'})}
    document.querySelector('#show-all').onclick=()=>{selectedRunID='';detailEl.classList.remove('visible');connect();loadRuns()};document.querySelector('#refresh').onclick=loadRuns;loadRuns();connect();setInterval(loadRuns,15000);
  </script>
</body>
</html>
