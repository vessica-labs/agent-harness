<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Agent Harness Runner</title>
  <style>
    :root { color-scheme: dark; --bg:#0a0d12; --panel:#111722; --line:#263145; --muted:#91a0b5; --text:#edf3fa; --accent:#73e0ba; --warn:#ffc66d; --bad:#ff8383; }
    * { box-sizing:border-box } body { margin:0; background:radial-gradient(circle at 12% 0,#152338 0,transparent 34%),var(--bg); color:var(--text); font:14px/1.45 ui-sans-serif,system-ui,sans-serif }
    header,main { width:min(1180px,calc(100% - 32px)); margin:auto } header { display:flex; align-items:end; justify-content:space-between; padding:36px 0 22px; gap:20px }
    h1 { margin:0; font-size:clamp(24px,4vw,38px); letter-spacing:-.04em } .eyebrow { color:var(--accent); text-transform:uppercase; letter-spacing:.16em; font-size:11px; font-weight:750 }
    .connection { display:flex; align-items:center; gap:8px; color:var(--muted) } .dot { width:9px; height:9px; border-radius:50%; background:var(--warn); box-shadow:0 0 0 4px #ffc66d22 }
    .dot.live { background:var(--accent); box-shadow:0 0 0 4px #73e0ba22 } .grid { display:grid; grid-template-columns:minmax(0,1.35fr) minmax(300px,.65fr); gap:16px; padding-bottom:32px }
    .panel { background:color-mix(in srgb,var(--panel) 92%,transparent); border:1px solid var(--line); border-radius:16px; overflow:hidden; box-shadow:0 18px 50px #0005 }
    .panel-head { display:flex; justify-content:space-between; align-items:center; padding:15px 18px; border-bottom:1px solid var(--line) } h2 { margin:0; font-size:14px } button { background:#1a2432; color:var(--text); border:1px solid #334157; border-radius:8px; padding:7px 11px; cursor:pointer }
    button:hover,button:focus-visible { border-color:var(--accent); outline:none } .runs { display:grid; gap:1px; background:var(--line) } .run { background:var(--panel); padding:16px 18px; cursor:pointer }
    .run:hover,.run:focus-visible { background:#151e2b; outline:none } .run-top { display:flex; gap:12px; align-items:center; justify-content:space-between } .run strong { font-size:15px } .meta { color:var(--muted); margin-top:7px; display:flex; flex-wrap:wrap; gap:10px }
    .pill { border:1px solid var(--line); border-radius:999px; padding:3px 8px; font-size:11px; text-transform:uppercase; letter-spacing:.06em } .pill.running { color:var(--accent) } .pill.paused { color:var(--bad) } .pill.queued { color:var(--warn) }
    .empty { padding:34px 18px; color:var(--muted); text-align:center; background:var(--panel) } .events { max-height:70vh; overflow:auto; padding:6px 0 } .event { padding:12px 16px; border-bottom:1px solid #202a3a }
    .event:last-child { border:0 } .event-head { display:flex; justify-content:space-between; gap:10px; color:var(--muted); font-size:11px } .event-type { color:var(--accent); font-family:ui-monospace,monospace } .event p { margin:5px 0 0 }
    .event.error p,.event.error .event-type { color:var(--bad) } .detail { display:none; padding:18px; border-top:1px solid var(--line); background:#0d131c } .detail.visible { display:block } dl { display:grid; grid-template-columns:120px 1fr; margin:0; gap:8px 12px } dt { color:var(--muted) } dd { margin:0; overflow-wrap:anywhere }
    .subhead { margin:20px 0 8px; font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em } .dag,.ticket-list,.artifact-list { display:flex; flex-wrap:wrap; gap:8px } .node,.ticket,.artifact { border:1px solid var(--line); border-radius:9px; padding:7px 9px; background:#121a26 } .node.completed,.ticket.completed { border-color:#397b68 } .node.running,.ticket.running { border-color:var(--accent) } .node small,.ticket small { display:block; color:var(--muted) } a { color:var(--accent) }
    @media (max-width:800px) { .grid { grid-template-columns:1fr } header { align-items:start; flex-direction:column } .events { max-height:440px } }
  </style>
</head>
<body>
  <header>
    <div><div class="eyebrow">Railway control plane</div><h1>Agent Harness Runner</h1></div>
    <div class="connection"><span id="dot" class="dot"></span><span id="connection">Connecting to event stream…</span></div>
  </header>
  <main class="grid">
    <section class="panel" aria-labelledby="runs-title">
      <div class="panel-head"><h2 id="runs-title">Pipeline runs</h2><button id="refresh" type="button">Refresh</button></div>
      <div id="runs" class="runs"><div class="empty">Loading runs…</div></div>
      <div id="detail" class="detail" aria-live="polite"></div>
    </section>
    <section class="panel" aria-labelledby="events-title">
      <div class="panel-head"><h2 id="events-title">Live events</h2><span id="event-count" class="pill">0</span></div>
      <div id="events" class="events" aria-live="polite"><div class="empty">Waiting for events…</div></div>
    </section>
  </main>
  <script>
    const runsEl=document.querySelector('#runs'),detailEl=document.querySelector('#detail'),eventsEl=document.querySelector('#events'); let events=[];
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const stamp=s=>s?new Date(s).toLocaleString():'—';
    async function loadRuns(){try{const r=await fetch('/api/v1/runs?limit=100');if(!r.ok)throw new Error(await r.text());const data=await r.json(),runs=Array.isArray(data.runs)?data.runs:[];runsEl.innerHTML=runs.length?runs.map(run=>`<article class="run" tabindex="0" data-id="${esc(run.id)}"><div class="run-top"><strong>${esc(run.source_issue_key)} · ${esc(run.source_issue_title)}</strong><span class="pill ${esc(run.state)}">${esc(run.state)}</span></div><div class="meta"><span>${esc(run.current_stage||'awaiting stage')}</span><span>attempt ${esc(run.attempt)}</span><span>${esc(stamp(run.updated_at))}</span></div></article>`).join(''):'<div class="empty">No runs yet. Add the trigger label to a registered Linear issue.</div>';document.querySelectorAll('.run').forEach(el=>{const show=()=>showRun(el.dataset.id);el.onclick=show;el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();show()}}})}catch(e){runsEl.innerHTML=`<div class="empty">${esc(e.message)}</div>`}}
    async function showRun(id){const r=await fetch('/api/v1/runs/'+encodeURIComponent(id));if(!r.ok)throw new Error(await r.text());const data=await r.json(),run=data.run||{},stages=Array.isArray(data.stages)?data.stages:[],tickets=Array.isArray(data.tickets)?data.tickets:[],artifacts=Array.isArray(data.artifacts)?data.artifacts:[];const dag=stages.map(s=>{const d=s.details||{};return `<div class="node ${esc(s.state)}"><strong>${esc(s.stage)}</strong><small>${esc(s.state)} · ${esc(d.mode||'stage')} · ×${esc(d.parallelism||1)}</small><small>${d.needs?.length?'after '+esc(d.needs.join(', ')):'root'}</small></div>`}).join('');const ticketRows=tickets.map(t=>`<div class="ticket ${esc(t.state)}"><strong>${esc(t.logical_key)}</strong><small>${esc(t.provider_issue_key||'not synced')} · ${esc(t.state)}</small><small>${t.dependencies?.length?'after '+esc(t.dependencies.join(', ')):'ready'}${t.commit_sha?' · '+esc(t.commit_sha.slice(0,8)):''}</small></div>`).join('');const artifactRows=artifacts.map(a=>`<a class="artifact" href="/api/v1/runs/${encodeURIComponent(id)}/artifacts?path=${encodeURIComponent(a.path)}">${esc(a.path)} <small>${esc(a.size)} bytes</small></a>`).join('');detailEl.classList.add('visible');detailEl.innerHTML=`<dl><dt>Run</dt><dd>${esc(run.id)}</dd><dt>Issue</dt><dd><a href="${esc(run.source_issue_url)}">${esc(run.source_issue_key)}</a></dd><dt>Stage</dt><dd>${esc(run.current_stage||'—')}</dd><dt>Sandbox</dt><dd>${esc(run.sandbox_id||'—')}</dd><dt>Queue reason</dt><dd>${esc(run.queue_reason||'—')}</dd><dt>Branch</dt><dd>${esc(run.branch||'—')}</dd><dt>Pull request</dt><dd>${run.pull_request_url?`<a href="${esc(run.pull_request_url)}">${esc(run.pull_request_url)}</a>`:'—'}</dd><dt>Error</dt><dd>${esc(run.error||'—')}</dd></dl><h3 class="subhead">Pipeline DAG</h3><div class="dag">${dag||'<span class="empty">Awaiting worker pipeline</span>'}</div><h3 class="subhead">Logical tickets</h3><div class="ticket-list">${ticketRows||'<span class="empty">No tickets yet</span>'}</div><h3 class="subhead">Artifacts</h3><div class="artifact-list">${artifactRows||'<span class="empty">No artifacts yet</span>'}</div>`}
    function renderEvents(){document.querySelector('#event-count').textContent=events.length;eventsEl.innerHTML=events.length?events.slice(-150).reverse().map(e=>`<article class="event ${esc(e.level)}"><div class="event-head"><span class="event-type">${esc(e.type)}</span><time>${esc(new Date(e.created_at).toLocaleTimeString())}</time></div><p>${esc(e.message)}</p></article>`).join(''):'<div class="empty">Waiting for events…</div>'}
    function connect(){const source=new EventSource('/events');source.onopen=()=>{document.querySelector('#dot').classList.add('live');document.querySelector('#connection').textContent='Live event stream'};source.onmessage=event=>{try{events.push(JSON.parse(event.data));renderEvents();loadRuns()}catch{}};source.addEventListener('error',event=>{if(event.data){try{events.push(JSON.parse(event.data));renderEvents()}catch{}}document.querySelector('#dot').classList.remove('live');document.querySelector('#connection').textContent='Reconnecting…'})}
    document.querySelector('#refresh').onclick=loadRuns;loadRuns();connect();setInterval(loadRuns,15000);
  </script>
</body>
</html>
