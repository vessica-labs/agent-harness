<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Agent Harness Runner</title>
  <style>
    :root { color-scheme:dark; --bg:#080b10; --panel:#101620; --panel-2:#0c121a; --surface:#151e2b; --line:#253247; --line-strong:#35445c; --muted:#92a0b4; --text:#edf3f8; --accent:#75e4bc; --accent-soft:#17342f; --blue:#8bb8ff; --warn:#ffc66d; --bad:#ff8b8b; }
    * { box-sizing:border-box }
    body { min-height:100vh; margin:0; overflow-x:hidden; background:radial-gradient(circle at 10% -10%,#182942 0,transparent 38%),radial-gradient(circle at 92% 10%,#10221f 0,transparent 26%),var(--bg); color:var(--text); font:14px/1.45 ui-sans-serif,system-ui,-apple-system,sans-serif }
    header,main { width:min(1240px,calc(100% - 40px)); margin:auto }
    header { display:flex; align-items:end; justify-content:space-between; padding:36px 0 24px; gap:20px }
    h1 { margin:2px 0 0; font-size:clamp(28px,4vw,40px); line-height:1.05; letter-spacing:-.045em }
    .eyebrow,.overline { color:var(--accent); font:750 10px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace; text-transform:uppercase; letter-spacing:.17em }
    .lede { margin:8px 0 0; color:var(--muted); font-size:13px }
    .connection { display:flex; align-items:center; gap:9px; min-height:34px; padding:7px 11px; color:#b8c4d2; background:#0d141dba; border:1px solid var(--line); border-radius:999px; box-shadow:0 10px 30px #0003 }
    .dot { width:8px; height:8px; border-radius:50%; background:var(--warn); box-shadow:0 0 0 4px #ffc66d1f }
    .dot.live { background:var(--accent); box-shadow:0 0 0 4px #75e4bc20 }
    .grid { display:grid; grid-template-columns:minmax(0,1.45fr) minmax(330px,.7fr); align-items:start; gap:16px; padding-bottom:36px }
    .panel { background:color-mix(in srgb,var(--panel) 94%,transparent); border:1px solid var(--line); border-radius:16px; overflow:hidden; box-shadow:0 20px 60px #0005,0 1px 0 #ffffff08 inset }
    .events-panel { position:sticky; top:16px }
    .panel-head { display:flex; justify-content:space-between; align-items:center; min-height:58px; padding:12px 16px 12px 18px; border-bottom:1px solid var(--line) }
    .panel-title { display:grid; gap:2px }
    .panel-kicker { color:var(--muted); font:700 9px/1 ui-monospace,SFMono-Regular,Menlo,monospace; text-transform:uppercase; letter-spacing:.13em }
    h2 { margin:0; font-size:14px; letter-spacing:-.01em }
    button { min-height:34px; padding:6px 11px; color:var(--text); background:#182231; border:1px solid var(--line-strong); border-radius:8px; font:inherit; cursor:pointer; transition:border-color .15s ease,background .15s ease,transform .15s ease }
    button:hover { background:#1c2838; border-color:#50617a }
    button:focus-visible,a:focus-visible { outline:2px solid var(--accent); outline-offset:2px }
    .runs { display:grid; gap:1px; background:var(--line) }
    .run { display:block; width:100%; min-height:0; padding:16px 18px; color:var(--text); text-align:left; background:var(--panel); border:0; border-radius:0; cursor:pointer }
    .run:hover,.run:focus-visible { background:#151e2b; outline-offset:-3px }
    .run.selected { background:linear-gradient(90deg,#1a2d34,#182333 52%); box-shadow:inset 3px 0 var(--accent) }
    .run-top { display:flex; gap:12px; align-items:center; justify-content:space-between }
    .run strong { min-width:0; font-size:15px; letter-spacing:-.012em }
    .meta { display:flex; flex-wrap:wrap; gap:0; margin-top:7px; color:var(--muted); font-size:12px }
    .meta span:not(:last-child)::after { content:'·'; padding:0 8px; color:#56647a }
    .pill { display:inline-flex; align-items:center; border:1px solid var(--line-strong); border-radius:999px; padding:3px 8px; color:#b9c5d3; font:700 10px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace; text-transform:uppercase; letter-spacing:.07em; white-space:nowrap }
    .pill.completed { color:var(--accent); background:#10251f; border-color:#285d4d }
    .pill.running { color:var(--accent); background:var(--accent-soft); border-color:#3e8e75 }
    .pill.paused,.pill.failed { color:var(--bad); background:#2a171a; border-color:#6d343b }
    .pill.queued { color:var(--warn); background:#2a2416; border-color:#6c5930 }
    .run-group { padding:9px 18px 7px; color:#718097; background:var(--panel-2); font:750 9px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace; text-transform:uppercase; letter-spacing:.14em }
    .empty { padding:34px 18px; color:var(--muted); text-align:center; background:var(--panel) }
    .detail { display:none; padding:20px 18px 22px; border-top:1px solid var(--line); background:var(--panel-2) }
    .detail.visible { display:block }
    .detail-head { display:flex; align-items:start; justify-content:space-between; gap:16px; margin-bottom:14px }
    .detail-head h3 { margin:3px 0 0; font-size:19px; line-height:1.25; letter-spacing:-.025em }
    .metrics { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px; margin-bottom:16px }
    .metric { min-width:0; padding:11px 12px; background:#111a25; border:1px solid var(--line); border-radius:10px }
    .metric-label { display:block; margin-bottom:5px; color:var(--muted); font:700 9px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace; text-transform:uppercase; letter-spacing:.11em }
    .metric-value { display:block; overflow:hidden; color:var(--text); font-size:15px; font-weight:720; text-overflow:ellipsis; white-space:nowrap }
    .metric small { display:block; margin-top:2px; overflow:hidden; color:var(--muted); font-size:10px; text-overflow:ellipsis; white-space:nowrap }
    .facts { display:grid; grid-template-columns:105px minmax(0,1fr); margin:0; padding:13px 14px; gap:8px 12px; background:#0f1721; border:1px solid #202c3e; border-radius:10px }
    dt { color:var(--muted) }
    dd { min-width:0; margin:0; overflow-wrap:anywhere }
    code { color:#c8d5e4; font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace; overflow-wrap:anywhere; word-break:break-word }
    .subhead { display:flex; align-items:center; gap:9px; margin:21px 0 9px; color:#8d9bb0; font:750 10px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace; text-transform:uppercase; letter-spacing:.12em }
    .subhead::after { content:''; height:1px; flex:1; background:linear-gradient(90deg,var(--line),transparent) }
    .dag { display:grid; grid-template-columns:repeat(auto-fit,minmax(96px,1fr)); gap:7px; counter-reset:stage }
    .dag-step { min-width:0; counter-increment:stage }
    .node,.ticket,.artifact { border:1px solid var(--line); border-radius:9px; background:#121a26 }
    .node { position:relative; height:100%; padding:9px 9px 9px 34px }
    .node::before { content:counter(stage); position:absolute; top:9px; left:9px; display:grid; place-items:center; width:17px; height:17px; color:#8ea0b8; background:#0c121a; border:1px solid #344159; border-radius:50%; font:700 9px/1 ui-monospace,SFMono-Regular,Menlo,monospace }
    .node.completed,.ticket.completed { border-color:#315e53 }
    .node.completed::before { color:var(--accent); border-color:#397b68 }
    .node.running { border-color:var(--accent); background:var(--accent-soft); box-shadow:0 0 0 2px #75e4bc18 }
    .node strong,.ticket strong { display:block; letter-spacing:-.01em }
    .node small,.ticket small,.artifact small { display:block; color:var(--muted); font-size:10px }
    .ticket-list { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:7px }
    .ticket { min-width:0; padding:9px 10px; color:var(--text); text-decoration:none; transition:border-color .15s ease,background .15s ease }
    a.ticket:hover { background:#16212f; border-color:#4a5d78 }
    .ticket.running { border-color:var(--accent); background:#16322f; box-shadow:0 0 0 3px #75e4bc20; animation:pulse 1.6s ease-in-out infinite }
    .artifact-list { display:flex; flex-wrap:wrap; gap:7px }
    .artifact { padding:8px 10px; color:var(--accent); text-decoration:none }
    .artifact:hover { border-color:#4a5d78; background:#16212f }
    .artifact.external::after { content:'Notion'; margin-left:8px; color:var(--muted); font:700 9px/1 ui-monospace,SFMono-Regular,Menlo,monospace; text-transform:uppercase }
    .events { max-height:calc(100vh - 170px); overflow:auto; padding:4px 0; scrollbar-color:#344159 transparent }
    .event { position:relative; padding:12px 15px 13px 17px; border-bottom:1px solid #202a3a }
    .event::before { content:''; position:absolute; top:16px; left:8px; width:3px; height:3px; background:var(--accent); border-radius:50% }
    .event:last-child { border:0 }
    .event-head { display:flex; justify-content:space-between; gap:10px; color:var(--muted); font-size:10px }
    .event-type { overflow:hidden; color:var(--accent); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; text-overflow:ellipsis; white-space:nowrap }
    .event time { white-space:nowrap }
    .event p { margin:5px 0 0; color:#dce5ee; line-height:1.42; overflow-wrap:anywhere }
    .event.error p,.event.error .event-type { color:var(--bad) }
    .event.error::before { background:var(--bad) }
    .activity { background:linear-gradient(90deg,#111a28 0,transparent 55%) }
    .activity::before { background:var(--blue) }
    .activity .event-type { color:var(--blue) }
    .activity p::before { content:'› '; color:var(--blue) }
    a { color:var(--accent); text-underline-offset:3px }
    @keyframes pulse { 50% { box-shadow:0 0 0 6px #75e4bc0a } }
    @media (max-width:900px) { header,main { width:min(100% - 24px,760px) } .grid { grid-template-columns:1fr } .events-panel { position:static } .events { max-height:480px } }
    @media (max-width:580px) { header { align-items:start; flex-direction:column; padding-top:26px } .connection { align-self:stretch; justify-content:center } .panel-head { padding-inline:13px } .run { padding-inline:14px } .run-top,.detail-head { align-items:start; flex-wrap:wrap } .run-top strong { flex:1 1 220px } .meta span:last-child { flex-basis:100%; margin-top:3px } .meta span:nth-last-child(2)::after { content:''; padding:0 } .detail { padding-inline:13px } .metrics { grid-template-columns:repeat(2,minmax(0,1fr)) } .facts { grid-template-columns:minmax(0,1fr); gap:2px } .facts dd { max-width:100%; margin-bottom:7px } .dag { grid-template-columns:repeat(2,minmax(0,1fr)) } }
    @media (prefers-reduced-motion:reduce) { * { scroll-behavior:auto!important; animation:none!important; transition:none!important } }
  </style>
</head>
<body>
  <header>
    <div><div class="eyebrow">Railway control plane</div><h1>Agent Harness Runner</h1><p class="lede">From Linear issue to draft pull request.</p></div>
    <div class="connection" role="status" aria-live="polite"><span id="dot" class="dot"></span><span id="connection">Connecting to event stream…</span></div>
  </header>
  <main class="grid">
    <section class="panel" aria-labelledby="runs-title">
      <div class="panel-head"><div class="panel-title"><span class="panel-kicker">Execution journal</span><h2 id="runs-title">Pipeline runs</h2></div><button id="refresh" type="button">Refresh</button></div>
      <div id="runs" class="runs"><div class="empty">Loading runs…</div></div>
      <div id="detail" class="detail" aria-live="polite"></div>
    </section>
    <section class="panel events-panel" aria-labelledby="events-title">
      <div class="panel-head"><div class="panel-title"><span class="panel-kicker">Activity feed</span><h2 id="events-title">Live events · all runs</h2></div><div><button id="show-all" type="button" hidden>Show all runs</button> <span id="event-count" class="pill" aria-label="Event count">0</span></div></div>
      <div id="events" class="events" role="log" aria-live="polite" aria-relevant="additions text"><div class="empty">Waiting for events…</div></div>
    </section>
  </main>
  <script>
    const runsEl=document.querySelector('#runs'),detailEl=document.querySelector('#detail'),eventsEl=document.querySelector('#events');
    let events=[],selectedRunID='',eventSource=null,refreshTimer=null;
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const stamp=s=>s?new Date(s).toLocaleString():'—';
    const duration=ms=>{if(!ms)return '—';const seconds=Math.round(ms/1000);if(seconds<60)return seconds+'s';const minutes=Math.floor(seconds/60),rest=seconds%60;return `${minutes}m ${rest}s`};
    const tokens=run=>(Number(run.input_tokens)||0)+(Number(run.output_tokens)||0);
    const externalLink=(syncs,key,provider)=>syncs.find(s=>s.logical_key===key&&s.provider===provider&&s.state==='synced'&&s.external_url)?.external_url||'';
    const runStageLabel=run=>run.current_stage||(run.state==='completed'?'pipeline complete':run.state==='cancelled'?'cancelled':'awaiting stage');
    const runCard=run=>`<button type="button" class="run ${run.id===selectedRunID?'selected':''}" data-id="${esc(run.id)}" aria-pressed="${run.id===selectedRunID}"><span class="run-top"><strong>${esc(run.source_issue_key)} · ${esc(run.source_issue_title)}</strong><span class="pill ${esc(run.state)}">${esc(run.state)}</span></span><span class="meta"><span>${esc(runStageLabel(run))}</span><span>${esc(duration(run.duration_ms))}</span><span>${tokens(run).toLocaleString()} tokens</span><span>${esc(stamp(run.updated_at))}</span></span></button>`;
    async function loadRuns(){try{const r=await fetch('/api/v1/runs?limit=100');if(!r.ok)throw new Error(await r.text());const data=await r.json(),runs=(Array.isArray(data.runs)?data.runs:[]).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)),active=runs.filter(run=>!['completed','cancelled'].includes(run.state)),history=runs.filter(run=>['completed','cancelled'].includes(run.state));runsEl.innerHTML=runs.length?`${active.length?'<div class="run-group">Current runs</div>'+active.map(runCard).join(''):''}${history.length?'<div class="run-group">Run history · newest first</div>'+history.map(runCard).join(''):''}`:'<div class="empty">No runs yet. Add the trigger label to a registered Linear issue.</div>';document.querySelectorAll('.run').forEach(el=>{el.onclick=()=>showRun(el.dataset.id,true)})}catch(e){runsEl.innerHTML=`<div class="empty">${esc(e.message)}</div>`}}
    async function showRun(id,select=false){if(select&&selectedRunID!==id){selectedRunID=id;connect(id);loadRuns()}const r=await fetch('/api/v1/runs/'+encodeURIComponent(id));if(!r.ok)throw new Error(await r.text());const data=await r.json(),run=data.run||{},stageOrder=s=>Number.isFinite(Number(s.details?.order))?Number(s.details.order):999,stages=(Array.isArray(data.stages)?data.stages:[]).sort((a,b)=>stageOrder(a)-stageOrder(b)),tickets=Array.isArray(data.tickets)?data.tickets:[],artifacts=Array.isArray(data.artifacts)?data.artifacts:[],syncs=Array.isArray(data.external_syncs)?data.external_syncs:[];const dag=stages.map(s=>{const d=s.details||{};return `<div class="dag-step"><div class="node ${esc(s.state)}"><strong>${esc(s.stage)}</strong><small>${esc(s.state)} · ${esc(d.mode||'stage')} · ×${esc(d.parallelism||1)}</small><small>${d.needs?.length?'after '+esc(d.needs.join(', ')):'entry stage'}</small></div></div>`}).join('');const ticketRows=tickets.map(t=>{const url=externalLink(syncs,'ticket:'+t.logical_key,'linear'),tag=url?'a':'div';return `<${tag} class="ticket ${esc(t.state)}"${url?` href="${esc(url)}" target="_blank" rel="noopener"`:''}${t.state==='running'?' aria-current="step"':''}><strong>${esc(t.logical_key)}</strong><small>${esc(t.provider_issue_key||'not synced')} · ${esc(t.state)}</small><small>${t.dependencies?.length?'after '+esc(t.dependencies.join(', ')):'ready'}${t.commit_sha?' · '+esc(t.commit_sha.slice(0,8)):''}</small></${tag}>`}).join('');const notionRows=syncs.filter(s=>s.provider==='notion'&&s.logical_key.startsWith('artifact:')&&s.state==='synced'&&s.external_url).map(s=>`<a class="artifact external" href="${esc(s.external_url)}" target="_blank" rel="noopener">${esc(s.logical_key.slice(9))}</a>`).join(''),localRows=artifacts.map(a=>`<a class="artifact" href="/api/v1/runs/${encodeURIComponent(id)}/artifacts?path=${encodeURIComponent(a.path)}">${esc(a.path)} <small>${esc(a.size)} bytes</small></a>`).join(''),artifactRows=notionRows+localRows,totalTokens=tokens(run),model=run.codex_model||'Awaiting telemetry',factRows=[['Issue',`<a href="${esc(run.source_issue_url)}" target="_blank" rel="noopener">${esc(run.source_issue_key)}</a>`],['Run ID',`<code>${esc(run.id)}</code>`],run.current_stage&&['Current stage',esc(run.current_stage)],run.sandbox_id&&['Sandbox',`<code>${esc(run.sandbox_id)}</code>`],run.queue_reason&&['Queue reason',esc(run.queue_reason)],run.branch&&['Branch',`<code>${esc(run.branch)}</code>`],run.pull_request_url&&['Pull request',`<a href="${esc(run.pull_request_url)}" target="_blank" rel="noopener">Open draft PR</a>`],run.error&&['Error',esc(run.error)]].filter(Boolean).map(([label,value])=>`<dt>${label}</dt><dd>${value}</dd>`).join('');detailEl.classList.add('visible');detailEl.innerHTML=`<div class="detail-head"><div><span class="overline">${esc(run.source_issue_key)} · run detail</span><h3>${esc(run.source_issue_title)}</h3></div><span class="pill ${esc(run.state)}">${esc(run.state)}</span></div><div class="metrics"><div class="metric"><span class="metric-label">Duration</span><span class="metric-value">${esc(duration(run.duration_ms))}</span><small>${Number(run.codex_calls||0).toLocaleString()} model calls</small></div><div class="metric"><span class="metric-label">Tokens</span><span class="metric-value">${totalTokens.toLocaleString()}</span><small>${Number(run.cached_input_tokens||0).toLocaleString()} cached input</small></div><div class="metric"><span class="metric-label">Model</span><span class="metric-value" title="${esc(model)}">${esc(model)}</span><small>${Number(run.reasoning_output_tokens||0).toLocaleString()} reasoning tokens</small></div><div class="metric"><span class="metric-label">Est. API cost</span><span class="metric-value">$${Number(run.estimated_api_cost_usd||0).toFixed(4)}</span><small>API-equivalent estimate</small></div></div><dl class="facts">${factRows}</dl><h3 class="subhead">Pipeline DAG · execution order</h3><div class="dag">${dag||'<span class="empty">Awaiting worker pipeline</span>'}</div><h3 class="subhead">Logical tickets</h3><div class="ticket-list">${ticketRows||'<span class="empty">No tickets yet</span>'}</div><h3 class="subhead">Artifacts</h3><div class="artifact-list">${artifactRows||'<span class="empty">No artifacts yet</span>'}</div>`}
    function renderEvents(){document.querySelector('#event-count').textContent=events.length;eventsEl.innerHTML=events.length?events.slice(-150).reverse().map(e=>`<article class="event ${esc(e.level)} ${e.type?.startsWith('codex.')?'activity':''}"><div class="event-head"><span class="event-type">${esc(e.type)}</span><time>${esc(new Date(e.created_at).toLocaleTimeString())}</time></div><p>${esc(e.message)}</p></article>`).join(''):'<div class="empty">Waiting for events…</div>'}
    function scheduleRefresh(){clearTimeout(refreshTimer);refreshTimer=setTimeout(()=>{loadRuns();if(selectedRunID)showRun(selectedRunID)},250)}
    function connect(runID=''){if(eventSource)eventSource.close();events=[];renderEvents();const title=document.querySelector('#events-title'),all=document.querySelector('#show-all');title.textContent=runID?'Live events · selected run':'Live events · all runs';all.hidden=!runID;eventSource=new EventSource('/events'+(runID?'?run_id='+encodeURIComponent(runID):''));eventSource.onopen=()=>{document.querySelector('#dot').classList.add('live');document.querySelector('#connection').textContent=runID?'Selected run stream':'All-runs event stream'};eventSource.onmessage=event=>{try{events.push(JSON.parse(event.data));renderEvents();scheduleRefresh()}catch{}};eventSource.addEventListener('error',event=>{if(event.data){try{events.push(JSON.parse(event.data));renderEvents()}catch{}}document.querySelector('#dot').classList.remove('live');document.querySelector('#connection').textContent='Reconnecting…'})}
    document.querySelector('#show-all').onclick=()=>{selectedRunID='';detailEl.classList.remove('visible');connect();loadRuns()};document.querySelector('#refresh').onclick=loadRuns;loadRuns();connect();setInterval(loadRuns,15000);
  </script>
</body>
</html>
