services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: agent_harness
      POSTGRES_USER: harness
      POSTGRES_PASSWORD: harness
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harness -d agent_harness"]
      interval: 2s
      timeout: 2s
      retries: 20
