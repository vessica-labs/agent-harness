name: Cloud runner

on:
  pull_request:
    paths:
      - Makefile
      - cloud-runner/**
      - plugins/agent-harness/**
      - scripts/release.py
      - tests/**
      - .github/workflows/cloud-runner.yml
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cloud-runner/go.mod
          cache-dependency-path: cloud-runner/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - run: make verify
        working-directory: cloud-runner
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
        working-directory: cloud-runner

  container-smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build the deployment image
        run: docker build --tag agent-harness:verify --build-arg VERSION=security-check cloud-runner
      - name: Verify runtime tools without network access
        run: >-
          docker run --rm --network none --entrypoint sh agent-harness:verify -ec
          'test "$(node --version)" = v22.23.4;
          test "$(id -u)" = 10001;
          test "$(npm --version)" = 12.2.1;
          agent-harness --version;
          railway --version;
          codex --version;
          chromium --version;
          python3 --version'

      - name: Scan deployment image
        run: |
          curl --fail --location --silent --show-error --output trivy.tar.gz \
            https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-64bit.tar.gz
          printf '%s  trivy.tar.gz\n' 2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a | sha256sum --check
          tar -xzf trivy.tar.gz trivy
          ./trivy image --scanners vuln --format json --output harness-image-scan.json agent-harness:verify
          python3 - <<'PYSCAN'
          import json
          data = json.load(open("harness-image-scan.json"))
          failures = [v for r in data.get("Results", []) for v in r.get("Vulnerabilities", [])
                      if v.get("Severity") in ("HIGH", "CRITICAL") and v.get("FixedVersion")]
          for v in failures:
              print(v["VulnerabilityID"], v["PkgName"], v["InstalledVersion"], "->", v["FixedVersion"])
          raise SystemExit(bool(failures))
          PYSCAN
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harness-image-scan
          path: harness-image-scan.json
          if-no-files-found: ignore

  container:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: cloud-runner
          build-args: VERSION=${{ github.ref_name }}
          push: true
          tags: |
            ghcr.io/vessica-labs/agent-harness:${{ github.ref_name }}
            ghcr.io/vessica-labs/agent-harness:sha-${{ github.sha }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cloud-runner/go.mod
          cache-dependency-path: cloud-runner/go.sum
      - name: Build binary
        working-directory: cloud-runner
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags="-s -w -X github.com/vessica-labs/agent-harness/cloud-runner/internal/cli.Version=${GITHUB_REF_NAME}" -o agent-harness-${GOOS}-${GOARCH} ./cmd/agent-harness
      - uses: actions/upload-artifact@v4
        with:
          name: agent-harness-${{ matrix.goos }}-${{ matrix.goarch }}
          path: cloud-runner/agent-harness-${{ matrix.goos }}-${{ matrix.goarch }}

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Package checksums and helper
        run: |
          cp plugins/agent-harness/scripts/harnessctl.py dist/harnessctl.py
          cd dist
          sha256sum agent-harness-* harnessctl.py > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --generate-notes
