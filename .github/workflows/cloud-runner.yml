name: Cloud runner

on:
  pull_request:
    paths:
      - cloud-runner/**
      - plugins/agent-harness/**
      - tests/**
      - .github/workflows/cloud-runner.yml
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cloud-runner/go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - run: make verify
        working-directory: cloud-runner

  container:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: cloud-runner
          push: true
          tags: |
            ghcr.io/vessica-labs/agent-harness:${{ github.ref_name }}
            ghcr.io/vessica-labs/agent-harness:sha-${{ github.sha }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cloud-runner/go.mod
      - name: Build binary
        working-directory: cloud-runner
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags="-s -w" -o agent-harness-${GOOS}-${GOARCH} ./cmd/agent-harness
      - uses: actions/upload-artifact@v4
        with:
          name: agent-harness-${{ matrix.goos }}-${{ matrix.goarch }}
          path: cloud-runner/agent-harness-${{ matrix.goos }}-${{ matrix.goarch }}

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Package checksums and helper
        run: |
          cp plugins/agent-harness/scripts/harnessctl.py dist/harnessctl.py
          cd dist
          sha256sum agent-harness-* harnessctl.py > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --generate-notes
